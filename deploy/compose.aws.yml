name: canopy-aws
x-environment: &environment
  DATABASE_URL: ${DATABASE_URL:?Set private RDS connection URL}
  UPLOAD_DIR: /app/uploads
  MODEL_PATH: /app/models/selected.pt
  CORS_ORIGINS: ${CORS_ORIGINS:?Set HTTPS application origin}
  WEATHER_ENABLED: ${WEATHER_ENABLED:-true}
  OPEN_METEO_API_KEY: ${OPEN_METEO_API_KEY:-}
  EXPERT_EMAIL: ${EXPERT_EMAIL:-}
  EXPERT_NAME: ${EXPERT_NAME:-Agricultural support}
services:
  migrate:
    image: ${CANOPY_BACKEND_IMAGE:?Set ECR backend image digest}
    environment: *environment
    command: [alembic, -c, backend/alembic.ini, upgrade, head]
  backend:
    image: ${CANOPY_BACKEND_IMAGE:?Set ECR backend image digest}
    restart: unless-stopped
    environment: *environment
    volumes:
      - /srv/canopy/uploads:/app/uploads
      - /srv/canopy/models:/app/models:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  frontend:
    image: ${CANOPY_FRONTEND_IMAGE:?Set ECR frontend image digest}
    restart: unless-stopped
    ports: ['8080:8080']
    depends_on:
      backend: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
