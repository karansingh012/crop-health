limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 9m;
 limit_req_status 429;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' mailto:" always;
 location = /api/docs {
   proxy_pass http://backend:8000;
   add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; img-src 'self' https://fastapi.tiangolo.com data:; object-src 'none'; frame-ancestors 'none'" always;
   add_header X-Content-Type-Options nosniff always;
 }
 location /api/ {
   limit_req zone=api burst=60 nodelay;
   proxy_pass http://backend:8000;
   proxy_set_header Host $host;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_read_timeout 90s;
 }
 location / { try_files $uri $uri/ /index.html; }
}
